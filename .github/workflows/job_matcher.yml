name: Job Matcher Scraper

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allow manual execution via GitHub UI and support mock run briefings
    inputs:
      send_test_email:
        description: 'Send a mock test email (true/false)'
        required: false
        default: 'false'

jobs:
  run-scraper-and-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: Run Job Scraper & AI Matcher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        SEND_TEST_EMAIL: ${{ github.event.inputs.send_test_email || 'false' }}
      run: |
        python evaluate_jobs_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add scraped_jobs.json
        if [ -f job_matches_report.md ]; then git add job_matches_report.md; fi
        if ! git diff --cached --quiet; then
          git commit -m "Automated update: scraped jobs and match report [skip ci]"
          git pull --rebase origin main
          git push
        else
          echo "No changes to commit"
        fi
